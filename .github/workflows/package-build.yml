name: Package build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openwrt:
    name: OpenWrt / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - mips_24kc
          - mipsel_24kc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build agent package from source
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_LOG: 1
          PACKAGES: 51ddns-agent
          V: s
      - name: Upload OpenWrt packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.arch }}
          path: |
            bin/**/*.apk
            bin/**/*.ipk
          if-no-files-found: error

  immortalwrt:
    name: ImmortalWrt / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - mips_24kc
          - mipsel_24kc
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build agent package from source
        uses: immortalwrt/gh-action-sdk@master
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_LOG: 1
          PACKAGES: 51ddns-agent
          V: s
      - name: Upload ImmortalWrt packages
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ matrix.arch }}
          path: |
            bin/**/*.apk
            bin/**/*.ipk
          if-no-files-found: error
