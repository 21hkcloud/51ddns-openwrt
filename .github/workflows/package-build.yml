name: Package build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openwrt:
    name: OpenWrt / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86/64
          - arch: aarch64_generic
            target: armsr/armv8
          - arch: mips_24kc
            target: ath79/generic
          - arch: mipsel_24kc
            target: ramips/mt7621
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build agent package from the OpenWrt 25.12.5 SDK
        shell: bash
        env:
          OPENWRT_VERSION: 25.12.5
          OPENWRT_TARGET: ${{ matrix.target }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          release_base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          sdk_file="$({ curl -fsSL "${release_base}/" | grep -oE "openwrt-sdk-${OPENWRT_VERSION}-[^\"]+\.Linux-x86_64\.tar\.zst" || true; } | sort -u | head -n 1)"
          if [ -z "${sdk_file}" ]; then
            echo "Unable to locate the OpenWrt SDK for ${OPENWRT_TARGET}" >&2
            exit 1
          fi

          curl -fsSL --retry 3 "${release_base}/sha256sums" -o "${RUNNER_TEMP}/sha256sums"
          curl -fL --retry 3 "${release_base}/${sdk_file}" -o "${RUNNER_TEMP}/${sdk_file}"
          (
            cd "${RUNNER_TEMP}"
            grep -F " *${sdk_file}" sha256sums | sha256sum -c -
          )

          sdk_dir="${RUNNER_TEMP}/openwrt-sdk-${PACKAGE_ARCH}"
          mkdir -p "${sdk_dir}"
          tar --zstd -xf "${RUNNER_TEMP}/${sdk_file}" --strip-components=1 -C "${sdk_dir}"
          cd "${sdk_dir}"

          # Release SDKs omit some built-in package sources. Pull only the
          # target-header providers from the matching OpenWrt release tag.
          deps_source="${RUNNER_TEMP}/openwrt-source-${OPENWRT_VERSION}"
          deps_feed="${RUNNER_TEMP}/sdkdeps"
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "v${OPENWRT_VERSION}" \
            https://github.com/openwrt/openwrt.git "${deps_source}"
          git -C "${deps_source}" sparse-checkout set \
            package/libs/libjson-c package/libs/libmd package/libs/libnl-tiny \
            package/libs/libubox package/libs/zlib package/network/utils/iwinfo \
            package/system/rpcd package/system/ubus package/system/uci \
            package/utils/lua package/utils/ucode
          mkdir -p "${deps_feed}"
          cp -a "${deps_source}/package/libs/libjson-c" "${deps_feed}/libjson-c"
          cp -a "${deps_source}/package/libs/libmd" "${deps_feed}/libmd"
          cp -a "${deps_source}/package/libs/libnl-tiny" "${deps_feed}/libnl-tiny"
          cp -a "${deps_source}/package/libs/libubox" "${deps_feed}/libubox"
          cp -a "${deps_source}/package/libs/zlib" "${deps_feed}/zlib"
          cp -a "${deps_source}/package/network/utils/iwinfo" "${deps_feed}/iwinfo"
          cp -a "${deps_source}/package/system/rpcd" "${deps_feed}/rpcd"
          cp -a "${deps_source}/package/system/ubus" "${deps_feed}/ubus"
          cp -a "${deps_source}/package/system/uci" "${deps_feed}/uci"
          cp -a "${deps_source}/package/utils/lua" "${deps_feed}/lua"
          cp -a "${deps_source}/package/utils/ucode" "${deps_feed}/ucode"

          # Keep every feed at the exact revision used to publish this SDK.
          curl -fsSL --retry 3 "${release_base}/feeds.buildinfo" -o feeds.conf
          printf 'src-link sdkdeps %s\n' "${deps_feed}" >> feeds.conf
          printf 'src-link action %s\n' "${GITHUB_WORKSPACE}" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -p sdkdeps -f -a
          ./scripts/feeds install -p action -f 51ddns-agent luci-app-51ddns
          printf '%s\n' \
            'CONFIG_PACKAGE_51ddns-agent=m' \
            'CONFIG_PACKAGE_luci-app-51ddns=m' >> .config
          make defconfig
          make package/51ddns-agent/download V=s
          make -j"$(nproc)" package/51ddns-agent/compile V=s
          # A release SDK does not ship target development headers. Stage the
          # three LuCI build dependencies before compiling their consumers.
          make -j1 package/feeds/sdkdeps/zlib/compile V=s
          make -j1 package/feeds/sdkdeps/libmd/compile V=s
          make -j1 package/feeds/sdkdeps/libjson-c/host/compile V=s
          make -j1 package/feeds/sdkdeps/libjson-c/compile V=s
          make -j1 package/feeds/sdkdeps/lua/compile V=s
          make -j1 package/feeds/sdkdeps/libubox/compile V=s
          make -j1 package/feeds/sdkdeps/ubus/compile V=s
          make -j1 package/feeds/sdkdeps/uci/compile V=s
          make -j1 package/feeds/sdkdeps/libnl-tiny/compile V=s
          make -j1 package/feeds/sdkdeps/ucode/compile V=s
          make -j1 package/feeds/sdkdeps/iwinfo/compile V=s
          make -j1 package/feeds/sdkdeps/rpcd/compile V=s
          make -j1 package/luci-app-51ddns/compile V=s

          artifact_dir="${GITHUB_WORKSPACE}/artifacts/openwrt-${PACKAGE_ARCH}"
          mkdir -p "${artifact_dir}"
          find bin -type f \( -name '*.apk' -o -name '*.ipk' \) \
            -exec cp --parents '{}' "${artifact_dir}" \;
      - name: Upload OpenWrt packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ matrix.arch }}
          path: |
            artifacts/openwrt-${{ matrix.arch }}/**/*.apk
            artifacts/openwrt-${{ matrix.arch }}/**/*.ipk
          if-no-files-found: error

  openwrt-24-10:
    name: OpenWrt 24.10 / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86/64
          - arch: aarch64_cortex-a53
            target: mediatek/filogic
          - arch: mips_24kc
            target: ath79/generic
          - arch: mipsel_24kc
            target: ramips/mt7621
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build agent IPK from the OpenWrt 24.10.8 SDK
        shell: bash
        env:
          OPENWRT_VERSION: 24.10.8
          OPENWRT_TARGET: ${{ matrix.target }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          release_base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${OPENWRT_TARGET}"
          sdk_file="$({ curl -fsSL "${release_base}/" | grep -oE "openwrt-sdk-${OPENWRT_VERSION}-[^\"]+\.Linux-x86_64\.tar\.zst" || true; } | sort -u | head -n 1)"
          if [ -z "${sdk_file}" ]; then
            echo "Unable to locate the OpenWrt SDK for ${OPENWRT_TARGET}" >&2
            exit 1
          fi

          curl -fsSL --retry 3 "${release_base}/sha256sums" -o "${RUNNER_TEMP}/sha256sums"
          curl -fL --retry 3 "${release_base}/${sdk_file}" -o "${RUNNER_TEMP}/${sdk_file}"
          (
            cd "${RUNNER_TEMP}"
            grep -F " *${sdk_file}" sha256sums | sha256sum -c -
          )

          sdk_dir="${RUNNER_TEMP}/openwrt-24.10-sdk-${PACKAGE_ARCH}"
          mkdir -p "${sdk_dir}"
          tar --zstd -xf "${RUNNER_TEMP}/${sdk_file}" --strip-components=1 -C "${sdk_dir}"
          cd "${sdk_dir}"

          # Release SDKs omit some built-in package sources. Pull only the
          # target-header providers from the matching OpenWrt release tag.
          deps_source="${RUNNER_TEMP}/openwrt-source-${OPENWRT_VERSION}"
          deps_feed="${RUNNER_TEMP}/sdkdeps"
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "v${OPENWRT_VERSION}" \
            https://github.com/openwrt/openwrt.git "${deps_source}"
          git -C "${deps_source}" sparse-checkout set \
            package/libs/libjson-c package/libs/libmd package/libs/libnl-tiny \
            package/libs/libubox package/libs/zlib package/network/utils/iwinfo \
            package/system/rpcd package/system/ubus package/system/uci \
            package/utils/lua package/utils/ucode
          mkdir -p "${deps_feed}"
          cp -a "${deps_source}/package/libs/libjson-c" "${deps_feed}/libjson-c"
          cp -a "${deps_source}/package/libs/libmd" "${deps_feed}/libmd"
          cp -a "${deps_source}/package/libs/libnl-tiny" "${deps_feed}/libnl-tiny"
          cp -a "${deps_source}/package/libs/libubox" "${deps_feed}/libubox"
          cp -a "${deps_source}/package/libs/zlib" "${deps_feed}/zlib"
          cp -a "${deps_source}/package/network/utils/iwinfo" "${deps_feed}/iwinfo"
          cp -a "${deps_source}/package/system/rpcd" "${deps_feed}/rpcd"
          cp -a "${deps_source}/package/system/ubus" "${deps_feed}/ubus"
          cp -a "${deps_source}/package/system/uci" "${deps_feed}/uci"
          cp -a "${deps_source}/package/utils/lua" "${deps_feed}/lua"
          cp -a "${deps_source}/package/utils/ucode" "${deps_feed}/ucode"

          # Match the feeds used by this release SDK while building 51DDNS
          # directly from the checked-out source tree.
          curl -fsSL --retry 3 "${release_base}/feeds.buildinfo" -o feeds.conf
          printf 'src-link sdkdeps %s\n' "${deps_feed}" >> feeds.conf
          printf 'src-link action %s\n' "${GITHUB_WORKSPACE}" >> feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -p sdkdeps -f -a
          ./scripts/feeds install -p action -f 51ddns-agent luci-app-51ddns
          printf '%s\n' \
            'CONFIG_PACKAGE_51ddns-agent=m' \
            'CONFIG_PACKAGE_luci-app-51ddns=m' >> .config
          make defconfig
          make package/51ddns-agent/download V=s
          make -j"$(nproc)" package/51ddns-agent/compile V=s
          # A release SDK does not ship target development headers. Stage the
          # three LuCI build dependencies before compiling their consumers.
          make -j1 package/feeds/sdkdeps/zlib/compile V=s
          make -j1 package/feeds/sdkdeps/libmd/compile V=s
          make -j1 package/feeds/sdkdeps/libjson-c/host/compile V=s
          make -j1 package/feeds/sdkdeps/libjson-c/compile V=s
          make -j1 package/feeds/sdkdeps/lua/compile V=s
          make -j1 package/feeds/sdkdeps/libubox/compile V=s
          make -j1 package/feeds/sdkdeps/ubus/compile V=s
          make -j1 package/feeds/sdkdeps/uci/compile V=s
          make -j1 package/feeds/sdkdeps/libnl-tiny/compile V=s
          make -j1 package/feeds/sdkdeps/ucode/compile V=s
          make -j1 package/feeds/sdkdeps/iwinfo/compile V=s
          make -j1 package/feeds/sdkdeps/rpcd/compile V=s
          make -j1 package/luci-app-51ddns/compile V=s

          artifact_dir="${GITHUB_WORKSPACE}/artifacts/openwrt-24.10-${PACKAGE_ARCH}"
          mkdir -p "${artifact_dir}"
          find bin -type f -name '*.ipk' -exec cp --parents '{}' "${artifact_dir}" \;
      - name: Upload OpenWrt 24.10 IPK packages
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-24.10-${{ matrix.arch }}
          path: artifacts/openwrt-24.10-${{ matrix.arch }}/**/*.ipk
          if-no-files-found: error

  immortalwrt:
    name: ImmortalWrt / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - mips_24kc
          - mipsel_24kc
        include:
          - arch: x86_64
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build agent package from source
        if: matrix.arch != 'x86_64'
        uses: immortalwrt/gh-action-sdk@master
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_LOG: 1
          PACKAGES: 51ddns-agent luci-app-51ddns
          V: s
      - name: Build x86_64 SDK on a compatible glibc host
        if: matrix.arch == 'x86_64'
        timeout-minutes: 40
        shell: bash
        env:
          BUILD_LOG: 1
          PACKAGES: 51ddns-agent luci-app-51ddns
          V: s
        run: |
          set -euo pipefail
          sdk=/home/build/immortalwrt
          for path in "$sdk" /feed /artifacts; do
            if [ -e "$path" ] || [ -L "$path" ]; then
              echo "Refusing to reuse an existing build path: $path" >&2
              exit 1
            fi
          done
          cid=
          feed_mounted=0
          artifacts_mounted=0
          cleanup() {
            local result=$?
            local cleanup_failed=0
            trap - EXIT
            set +e
            if [ "$artifacts_mounted" = 1 ]; then sudo umount /artifacts || cleanup_failed=1; fi
            if [ "$feed_mounted" = 1 ]; then sudo umount /feed || cleanup_failed=1; fi
            if [ -n "$cid" ]; then docker rm "$cid" >/dev/null || cleanup_failed=1; fi
            if [ "$result" = 0 ]; then result=$cleanup_failed; fi
            exit "$result"
          }
          trap cleanup EXIT
          docker pull "immortalwrt/sdk:x86_64@sha256:711f23be365907cad96926aad7d4a69addbfe1f602bf858e58f864b3dd0eb537"
          cid=$(docker create "immortalwrt/sdk:x86_64@sha256:711f23be365907cad96926aad7d4a69addbfe1f602bf858e58f864b3dd0eb537")
          sudo mkdir -p /home/build
          sudo docker cp "$cid:/home/build/immortalwrt" "$sdk"
          sudo chown -R "$(id -u):$(id -g)" "$sdk"
          docker rm "$cid" >/dev/null
          cid=
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends   build-essential ccache cpio curl file g++-multilib gawk gcc-multilib   genisoimage gettext git libdw-dev libelf-dev libncurses-dev locales   pv pwgen python3 python3-pip python3-cryptography python3-pyelftools   qemu-utils rsync signify-openbsd subversion swig unzip wget zlib1g-dev   zstd clang-18 libclang-18-dev lld-18 shfmt
          curl -fsSL --retry 3   "https://raw.githubusercontent.com/immortalwrt/gh-action-sdk/c4848d7f7d899d80e6d98630f0a21ab2e9c4724f/entrypoint.sh"   -o "$RUNNER_TEMP/immortal-entrypoint.sh"
          printf '%s  %s\n' '87daa8ca223a925253c0b93c33a5a0417705467bbfbf27a4a2a3cd3ffe10ac32' "$RUNNER_TEMP/immortal-entrypoint.sh" | sha256sum -c -
          export STAGING_DIR_HOST="$sdk/staging_dir/host"
          export PATH="$sdk/staging_dir/host/bin:$sdk/staging_dir/hostpkg/bin:$PATH"
          getconf GNU_LIBC_VERSION
          "$sdk/staging_dir/host/bin/fakeroot" /usr/bin/true
          "$sdk/staging_dir/host/bin/apk" --version
          sudo mkdir /feed /artifacts
          sudo mount --bind "$GITHUB_WORKSPACE" /feed
          feed_mounted=1
          sudo mount --bind "$GITHUB_WORKSPACE" /artifacts
          artifacts_mounted=1
          cd "$sdk"
          bash "$RUNNER_TEMP/immortal-entrypoint.sh"
          for pattern in '51ddns-agent-0.6.6-r1.apk' 'luci-app-51ddns-0.1.6-r1.apk' 'luci-i18n-51ddns-zh-cn-*.apk'; do
            package_file=$(find "$GITHUB_WORKSPACE/bin" -type f -name "$pattern" -print -quit)
            if [ -z "$package_file" ]; then
              echo "Required output package missing: $pattern" >&2
              exit 1
            fi
            sha256sum "$package_file"
          done
      - name: Upload ImmortalWrt packages
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-${{ matrix.arch }}
          path: |
            bin/**/*.apk
            bin/**/*.ipk
          if-no-files-found: error
